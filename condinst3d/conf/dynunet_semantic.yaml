train:
  seed: 1000
  deterministic: false
  rlimit_nofile: 1048576
  resume: null

  output_root: outputs

  logger:
    _target_: pytorch_lightning.loggers.TensorBoardLogger
    save_dir: null
    name: tb
    version: null
    default_hp_metric: false

  logger_layout:
    add_custom_scalars: true
    iou_thresholds: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50]

  # optional: override defaults
  monitor: "Validation/Masks/mAP"
  monitor_mode: "max"
  save_top_k: 3
  save_last: true
  ckpt_filename: "best_{epoch}-{step}"
  ckpt_every_n_epochs: 1
  lr_logging_interval: "step"

  # DDP defaults (used if train.strategy not provided)
  ddp_backend: "nccl"

  trainer:
    accelerator: gpu
    devices: [0]
    max_epochs: 1000
    gradient_clip_algorithm: norm
    gradient_clip_val: 0.5
    accumulate_grad_batches: 1
    num_sanity_val_steps: 0
    check_val_every_n_epoch: 1
    log_every_n_steps: 1
    limit_train_batches: 1
    limit_val_batches: 1
    enable_progress_bar: true
    enable_model_summary: true


model:
  task_mode: semantic
  output_dir: null
  forward_chunk_size: 16
  max_mask_to_train: 512

  backbone:
    _target_: condinst3d.arch.backbone.dynunet.DynUNetBackbone
    spatial_dims: 3
    in_channels: 4
    out_channels: 1
    kernel_size: [ [ 3,3,1 ], [ 3,3,3 ], [ 3,3,3 ], [ 3,3,3 ], [ 3,3,3 ], [ 3,3,3 ] ]
    strides: [ [ 1,1,1 ], [ 2,2,1 ], [ 2,2,2 ], [ 2,2,2 ], [ 2,2,2 ], [ 2,2,1 ] ]
    upsample_kernel_size: [ [ 2,2,1 ], [ 2,2,2 ], [ 2,2,2 ], [ 2,2,2 ], [ 2,2,1 ] ]
    filters: [ 32, 64, 96, 128, 192, 256 ]
    heads_dim: 128
    decoder_strides: [ [ 16,16,8 ], [ 8,8,8 ], [ 4,4,4 ], [ 2,2,2 ], [ 1,1,1 ] ]
    head_start: 2
    head_end: 4

  finetune:
    backbone_ckpt: null

  matcher:
    num_candidates: 35
    center_in_gt: true
    anchors_sizes: [[6,6,4], [12,12,8], [24,24,16], [48,48,16]]

  heads:
    classification:
      num_classes: 1
      prior_probability: 0.02

    instance_segmentation:
      channels: 8
      num_layers: 3
      kernel_size: 1
      size_of_interest: 4

  losses:
    classification:
      _target_: torch.nn.BCEWithLogitsLoss
      reduction: "none"
      hard_negative_ratio: 3
      hard_negative_min: 32

    instance_segmentation:
      _target_: monai.losses.DiceCELoss
      to_onehot_y: false
      sigmoid: true
      reduction: "mean"

    semantic_segmentation:
      _target_: monai.losses.DiceCELoss
      to_onehot_y: false
      sigmoid: true
      reduction: "mean"

  inference:
    mask_thresh: 0.5
    score_thresh: 0.1
    nms_thresh: 0.75
    group_thresh: 0.35
    topk_candidates: 25

  evaluation:
    iou_list: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50]
    ap_n_interp: 101

  visualization:
    img_channels: ['t1w', 't2w', 'flr', 'freqmap']
    channel_seg_under_image: 3
    crop_size: [96, 96]
    show_slices: [-1, 0, 1]
    figsize: 1.5
    num_train_images_to_show: -1
    num_val_images_to_show: -1

  optim:
    freeze_backbone: false
    backbone_lr_mult: 1.0

    optimizer:
      _target_: torch.optim.AdamW
      lr: 3e-4
      weight_decay: 5e-5
      betas: [0.9, 0.999]

    scheduler:
      _target_: torch.optim.lr_scheduler.SequentialLR
      schedulers:
        - _target_: torch.optim.lr_scheduler.LinearLR
          start_factor: 0.1
          total_iters: 10
        - _target_: torch.optim.lr_scheduler.CosineAnnealingLR
          T_max: 990
          eta_min: 1e-6
      milestones: [10]

    scheduler_cfg:
      interval: epoch
      frequency: 1
      name: lr

data:
  image_mode: full   # or full
  full_image_size: [192, 224, 72]

  root_path: "/scratch/04/public_datasets/nnDet/Task100_PRL"
  fold: 0
  modalities: [ 't1w', 't2w', 'flr', 'freqmap' ]
  splits_path: "/scratch/04/public_datasets/nnDet/Task100_PRL/preprocessed/splits_final.pkl"
  num_workers:
    train: 0
    val: 0
    test: 0
  batch_size:
    train: 1
    val: 1
    test: 1

  empty_case_weight: 0.2
  instance_weight_power: 0.7

  patch_size: [ 96, 96, 48 ]
  patches_per_subject: 4
  patch_overlap: 0.5
  spatial_augmentation_prob: 0.25
  intensity_augmentation_prob: 0.25
